<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="/static/lab-scene.svg" type="image/svg+xml"><title>别让它听见</title>
<style>
:root{--ink:#e5efea;--muted:#9aafaa;--line:#315256;--void:#081113;--panel:#122022;--mint:#69c7b2;--amber:#efba59;--danger:#d95852}*{box-sizing:border-box}body{margin:0;min-width:320px;background:var(--void);color:var(--ink);font:16px/1.45 system-ui,sans-serif;letter-spacing:0}button,input{font:inherit}button{border:0;cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}.game{min-height:100svh}.top{min-height:72px;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px clamp(16px,3vw,44px);border-bottom:1px solid var(--line);background:#0c1719}.brand{display:flex;align-items:center;gap:12px;font-size:20px;font-weight:750}.mark{width:28px;height:28px;border:3px solid var(--mint);border-radius:50%;position:relative}.mark:after{content:"";position:absolute;width:6px;height:6px;right:-5px;top:-4px;border-radius:50%;background:var(--danger)}.room,.connection{color:var(--muted);font-size:13px}.signal{display:inline-block;width:9px;height:9px;margin-right:7px;border-radius:50%;background:#607d7a}.signal.live{background:var(--mint);box-shadow:0 0 0 4px #254c46}.layout{width:min(1480px,100%);margin:auto;padding:22px clamp(16px,3vw,44px) 30px;display:grid;grid-template-columns:minmax(0,1.55fr) minmax(290px,.72fr);gap:22px}.scene{min-height:620px;position:relative;overflow:hidden;border:1px solid var(--line);background:#10191d url('/static/lab-scene.svg') center/cover no-repeat}.scene:after{content:"";position:absolute;inset:0;border:10px solid #0d1719;pointer-events:none}.scene.alert:before{content:"";position:absolute;inset:0;background:#7b2623;opacity:.18}.hud{position:absolute;z-index:1;inset:0;display:flex;flex-direction:column;justify-content:space-between;padding:22px}.mission{display:flex;justify-content:space-between;gap:16px}.objective,.clock,.forbidden,.consequence,.meter{background:#0b1517e8}.objective{max-width:455px;padding:12px 14px;border-left:4px solid var(--mint)}.eyebrow{color:var(--mint);font-size:12px;font-weight:750}.objective h1{margin:2px 0 3px;font-size:22px;line-height:1.2}.objective p{margin:0;color:var(--muted);font-size:14px}.clock{min-width:108px;padding:9px 12px;border:1px solid #4a6665;text-align:center}.clock span{display:block;color:var(--muted);font-size:11px}.clock strong{font-size:30px;font-variant-numeric:tabular-nums;line-height:1}.clock.danger strong{color:var(--danger)}.forbidden{align-self:center;width:min(560px,100%);padding:15px 18px;border:1px solid #67807b;text-align:center}.words{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:8px}.word{min-width:104px;padding:9px 14px;background:#512724;color:#ffd9d2;font-size:23px;font-weight:800}.foot{display:flex;justify-content:space-between;gap:14px;align-items:end}.consequence{max-width:500px;padding:11px 13px;font-size:14px}.meter{width:190px;padding:10px}.meter label{display:flex;justify-content:space-between;color:var(--muted);font-size:11px}.segments{display:flex;gap:4px;margin-top:7px}.segments i{flex:1;height:8px;background:#34494a}.segments i.on{background:var(--danger)}aside{display:flex;flex-direction:column;gap:16px}.panel{border:1px solid var(--line);background:var(--panel)}.head{display:flex;justify-content:space-between;padding:14px 15px;border-bottom:1px solid var(--line);font-size:13px;font-weight:750}.pill{padding:3px 8px;background:#1d3e38;color:var(--mint);font-size:11px}.tasks{padding:8px 15px}.task{min-height:53px;display:flex;align-items:center;gap:10px;border-bottom:1px solid #2b4446;color:#aebfba}.task:last-child{border:0}.task b{width:22px;height:22px;display:grid;place-items:center;border:1px solid #597976;font-size:12px}.task.done{color:var(--ink)}.task.done b{background:var(--mint);border-color:var(--mint);color:#0b1717}.feed{min-height:250px;max-height:360px;overflow:auto;padding:8px 15px}.event{padding:9px 0;border-bottom:1px solid #253d3f;color:#bfd0ca;font-size:13px}.event strong{margin-right:7px;color:var(--amber);font-size:11px}.controls{display:grid;gap:11px;padding:15px}.primary,.listen{min-height:48px;font-weight:800}.primary{background:var(--mint);color:#0a1515}.listen{min-height:58px;background:#22463f;border:1px solid #69c7b2;color:#d9f7ed}.listen.live{background:#62302d;border-color:#e66c63;color:#ffe1da}.listen-status{min-height:20px;color:var(--muted);font-size:12px;text-align:center}.fallback{display:flex;gap:8px}.fallback input{min-width:0;flex:1;padding:10px;border:1px solid #3c595a;background:#0b1517;color:var(--ink)}.fallback button{padding:0 14px;background:#294548;color:#dcebe5}dialog{width:min(440px,calc(100% - 30px));padding:0;border:1px solid #527774;background:#132224;color:var(--ink)}dialog::backdrop{background:#030809cc}.lobby{padding:25px}.lobby h2{margin:0 0 6px;font-size:26px}.lobby p{margin:0 0 20px;color:var(--muted)}.lobby input{width:100%;margin:7px 0;padding:12px;border:1px solid #46615f;background:#0b1517;color:var(--ink)}.lobby-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.lobby-actions button{min-height:46px;background:#31595a;color:#effaf4;font-weight:750}.lobby-actions button:first-child{background:var(--mint);color:#0a1515}.empty{padding:9px 0;color:var(--muted);font-size:13px}@media(max-width:900px){.layout{grid-template-columns:1fr}.scene{min-height:520px}aside{display:grid;grid-template-columns:1fr 1fr}.controls{grid-column:1/-1}}@media(max-width:620px){.top{min-height:60px}.brand{font-size:17px}.connection{display:none}.layout{padding:12px;gap:12px}.scene{min-height:500px}.hud{padding:15px}.objective{padding:10px}.objective h1{font-size:18px}.clock{min-width:80px}.clock strong{font-size:24px}.foot{flex-direction:column;align-items:stretch}.meter{width:100%}aside{display:flex}.word{min-width:90px;font-size:20px}}
</style></head><body><main class="game"><header class="top"><div class="brand"><span class="mark"></span>别让它听见 <span class="room" id="roomLabel">未加入房间</span></div><div class="connection"><span class="signal" id="signal"></span><span id="connectionLabel">等待连接</span></div></header><section class="layout"><section class="scene" id="scene"><div class="hud"><div class="mission"><div class="objective"><div class="eyebrow" id="phase">任务待命</div><h1>逃生舱 03</h1><p id="objective">集齐三件物品，在怪物发现前启动逃生舱。</p></div><div class="clock" id="clock"><span>剩余时间</span><strong id="time">01:30</strong></div></div><div class="forbidden"><div class="eyebrow">它正在监听，别说</div><div class="words" id="words"><span class="word">--</span><span class="word">--</span></div></div><div class="foot"><div class="consequence" id="consequence">创建或加入一个房间以开始任务。</div><div class="meter"><label>警报等级 <span id="alert">0 / 5</span></label><div class="segments" id="segments"><i></i><i></i><i></i><i></i><i></i></div></div></div></div></section><aside><section class="panel"><div class="head"><span>逃生清单</span><span class="pill" id="progress">0 / 3</span></div><div class="tasks" id="tasks"></div></section><section class="panel"><div class="head"><span>监听记录</span><span class="pill" id="feedState">待命</span></div><div class="feed" id="feed"><div class="empty">等待任务开始</div></div></section><section class="panel"><div class="controls"><button class="primary" id="start" disabled>开始 90 秒任务</button><button class="listen" id="listen" disabled>启动持续监听</button><div class="listen-status" id="listenStatus"></div><div class="fallback"><input id="text" placeholder="无麦克风时，在这里输入语句" disabled><button id="send" disabled>发送</button></div></div></section></aside></section></main><dialog id="lobby"><form class="lobby" method="dialog"><h2>进入实验室</h2><p>两位玩家共享同一房间状态。说话是唯一的操作方式。</p><input id="player" maxlength="24" placeholder="你的代号"><input id="room" maxlength="16" placeholder="房间号（加入时填写）"><div class="lobby-actions"><button type="button" id="create">创建房间</button><button type="button" id="join">加入房间</button></div></form></dialog>
<script>
let socket,micStream,audioContext,workletNode,listening=false;const $=id=>document.getElementById(id),names=['钥匙','电池','样本'],secure=window.isSecureContext&&!!navigator.mediaDevices?.getUserMedia;const feed=(kind,message)=>{const box=$('feed');if(box.querySelector('.empty'))box.textContent='';const row=document.createElement('div');row.className='event';row.innerHTML=`<strong>${kind}</strong>${message}`;box.prepend(row)},time=seconds=>`${String(Math.floor(seconds/60)).padStart(2,'0')}:${String(seconds%60).padStart(2,'0')}`;$('lobby').showModal();function render(s){if(!s)return;$('phase').textContent=({lobby:'任务待命',active:'任务进行中',won:'逃生成功',lost:'任务失败'})[s.phase]||s.phase;$('objective').textContent=s.objective||'';$('time').textContent=time(s.remaining_time??90);$('clock').classList.toggle('danger',(s.remaining_time??90)<=15&&s.phase==='active');$('words').innerHTML=(s.forbidden_words||['--','--']).map(w=>`<span class="word">${w}</span>`).join('');$('consequence').textContent=s.last_consequence||'';$('alert').textContent=`${s.alert_level||0} / ${s.max_alert_level||5}`;$('segments').querySelectorAll('i').forEach((x,i)=>x.classList.toggle('on',i<(s.alert_level||0)));$('scene').classList.toggle('alert',(s.alert_level||0)>=3);$('progress').textContent=`${(s.completed_items||[]).length} / 3`;$('tasks').innerHTML=names.map((n,i)=>`<div class="task ${(s.completed_items||[]).includes(n)?'done':''}"><b>${(s.completed_items||[]).includes(n)?'✓':i+1}</b><span>${n}${s.next_item===n?' · 当前目标':''}</span></div>`).join('');$('feedState').textContent=s.phase==='active'?'监听中':s.phase==='won'?'已逃离':s.phase==='lost'?'已发现':'待命';$('start').textContent=s.phase==='active'?'任务进行中':s.phase==='won'||s.phase==='lost'?'重新开始任务':'开始 90 秒任务';$('start').disabled=s.phase==='active'}function stop(notify=true){const was=listening;listening=false;workletNode?.disconnect();micStream?.getTracks().forEach(t=>t.stop());audioContext?.close();workletNode=micStream=audioContext=null;if(notify&&was&&socket?.readyState===WebSocket.OPEN)socket.send(JSON.stringify({type:'linx_end'}));$('listen').classList.remove('live');$('listen').textContent='启动持续监听';if(!notify)$('listenStatus').textContent='持续监听已停止'}async function startListen(){if(!secure){$('listenStatus').textContent='请通过 HTTPS 打开页面并允许麦克风。';return}try{micStream=await navigator.mediaDevices.getUserMedia({audio:{channelCount:1,echoCancellation:true,noiseSuppression:true}});audioContext=new AudioContext({sampleRate:16000});await audioContext.audioWorklet.addModule('/static/pcm-worklet.js');workletNode=new AudioWorkletNode(audioContext,'pcm-capture');audioContext.createMediaStreamSource(micStream).connect(workletNode);workletNode.port.onmessage=({data})=>{if(!listening||socket?.readyState!==WebSocket.OPEN)return;const pcm=new Int16Array(data.length);for(let i=0;i<data.length;i++)pcm[i]=Math.max(-1,Math.min(1,data[i]))*32767;socket.send(pcm.buffer)};socket.send(JSON.stringify({type:'linx_start',sample_rate:audioContext.sampleRate,continuous:true}));listening=true;$('listen').classList.add('live');$('listen').textContent='停止持续监听';$('listenStatus').textContent='正在监听每一句话'}catch(e){$('listenStatus').textContent=`麦克风不可用：${e.message}`}}function enter(room,player){socket=new WebSocket(`${location.protocol==='https:'?'wss':'ws'}://${location.host}/ws/${room}?player_id=${encodeURIComponent(player)}`);socket.onopen=()=>{$('roomLabel').textContent=`房间 ${room}`;$('connectionLabel').textContent='已连接';$('signal').classList.add('live');['start','listen','text','send'].forEach(id=>$(id).disabled=false);$('lobby').close();feed('系统','已连接，等待任务开始。')};socket.onmessage=e=>{if(typeof e.data!=='string')return;const d=JSON.parse(e.data);if(d.state)render(d.state);if(d.event){const x=d.event,label={transcript:'听见',alert_raised:'警报',action_applied:'执行',game_started:'任务',game_won:'任务',game_lost:'任务'}[x.type]||'事件';feed(label,x.text||x.consequence||x.action||x.type)}if(d.type==='linx_ready')$('listenStatus').textContent='持续监听已连接';if(d.type==='linx_event'&&d.event.type==='stt')$('listenStatus').textContent=`识别：${d.event.text}`;if(d.type==='linx_error'){feed('错误',d.message);stop(false)}if(d.type==='linx_turn_complete')stop(false)};socket.onclose=()=>{$('connectionLabel').textContent='连接已断开';$('signal').classList.remove('live');stop(false)}}$('create').onclick=async()=>{const r=await fetch('/api/rooms',{method:'POST'}),d=await r.json();enter(d.room_id,$('player').value.trim()||`玩家-${Math.random().toString(16).slice(2,6)}`)};$('join').onclick=()=>{const room=$('room').value.trim().toUpperCase();if(room)enter(room,$('player').value.trim()||`玩家-${Math.random().toString(16).slice(2,6)}`)};$('start').onclick=()=>socket?.send(JSON.stringify({type:'game_start'}));$('listen').onclick=()=>listening?stop():startListen();$('send').onclick=()=>{const v=$('text').value.trim();if(v&&socket?.readyState===WebSocket.OPEN){socket.send(JSON.stringify({type:'say',text:v}));$('text').value=''}};$('text').addEventListener('keydown',e=>{if(e.key==='Enter')$('send').click()});$('listenStatus').textContent=secure?'点击启动后，AI 会持续监听每一句话。':'需要 HTTPS 才能使用麦克风；可先用文字试玩。';
</script></body></html>
