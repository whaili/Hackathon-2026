s alarm{50%{box-shadow:inset 0 0 0 999px #cc292229}}.radar{position:absolute;inset:0;width:100%;height:100%;z-index:-1}.hud{min-height:660px;position:relative;display:flex;flex-direction:column;justify-content:space-between;padding:23px}.upper{display:flex;justify-content:space-between;gap:14px}.mission{max-width:495px;padding:13px 15px;border-left:4px solid var(--mint);background:#071416dd;backdrop-filter:blur(6px)}.eyebrow{color:var(--mint);font-size:11px;font-weight:800;text-transform:uppercase}.mission h1{margin:2px 0 3px;font-size:25px;line-height:1.2}.mission p{margin:0;color:var(--muted);font-size:14px}.clock{min-width:112px;height:max-content;padding:9px 13px;border:1px solid #547775;background:#071416dd;text-align:center}.clock span{display:block;color:var(--muted);font-size:11px}.clock strong{font-size:31px;font-variant-numeric:tabular-nums;line-height:1}.clock.danger{border-color:var(--danger)}.clock.danger strong{color:var(--danger)}.listener{align-self:center;width:min(585px,100%);padding:14px 18px;border:1px solid #6f8885;background:#071416e8;text-align:center;backdrop-filter:blur(6px)}.listener .caption{color:var(--muted);font-size:12px}.words{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:7px}.word{min-width:120px;padding:9px 13px;background:#572b29;color:#ffe0d9;font-size:21px;font-weight:850;box-shadow:inset 0 0 0 1px #f1645d55}.lower{display:flex;justify-content:space-between;align-items:end;gap:15px}.consequence{max-width:560px;padding:11px 13px;background:#071416ed;border-left:3px solid var(--amber);font-size:14px}.meter{width:194px;padding:10px;background:#071416ed}.meter label{display:flex;justify-content:space-between;color:var(--muted);font-size:11px}.segments{display:flex;gap:4px;margin-top:7px}.segments i{height:8px;flex:1;background:#385353}.segments i.on{background:var(--danger);box-shadow:0 0 10px #f1645daa}aside{display:flex;flex-direction:column;gap:14px}.panel{border:1px solid var(--line);background:var(--panel)}.controls{display:grid;gap:10px;padding:15px}.primary,.listen{min-height:49px;font-weight:850}.primary{background:var(--mint);color:#061415}.listen{min-height:58px;border:1px solid var(--mint);background:#20483f;color:#e2fff5}.listen.live{border-color:var(--danger);background:#653330;color:#ffe1db;animation:pulse 1.2s ease-in-out infinite}@keyframes pulse{50%{box-shadow:0 0 0 7px #ee706922}}.listen-status{min-height:19px;text-align:center;color:var(--muted);font-size:12px}.voice-examples{display:grid;gap:5px;padding:10px;border:1px solid #385353;background:#091719;color:#c3d8d1;font-size:13px}.voice-examples span{color:var(--mint)}.head{display:flex;justify-content:space-between;align-items:center;padding:13px 14px;border-bottom:1px solid var(--line);font-weight:800;font-size:13px}.pill{padding:3px 8px;background:#1d463e;color:var(--mint);font-size:11px}.tasks{padding:7px 14px}.task{min-height:49px;display:flex;align-items:center;gap:10px;border-bottom:1px solid #2d4748;color:#aabfba;font-size:14px}.task:last-child{border-bottom:0}.task b{width:22px;height:22px;display:grid;place-items:center;border:1px solid #66817d;font-size:12px}.task.done{color:var(--ink)}.task.done b{border-color:var(--mint);background:var(--mint);color:#0a1818}.feed{min-height:188px;max-height:300px;overflow:auto;padding:4px 14px}.event{padding:9px 0;border-bottom:1px solid #2a4244;color:#c0d0ca;font-size:13px}.event strong{margin-right:7px;color:var(--amber);font-size:11px}.empty{color:var(--muted);padding:10px 0;font-size:13px}dialog{width:min(510px,calc(100% - 28px));max-height:calc(100svh - 28px);overflow:auto;padding:0;border:1px solid #527a75;background:#102326;color:var(--ink);box-shadow:0 28px 80px #000c}dialog::backdrop{background:#020809dd}.lobby{padding:25px}.lobby h2{margin:0 0 5px;font-size:27px}.lobby>p{margin:0 0 17px;color:var(--muted)}.mode-switch{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0 0 15px}.mode-switch button{min-height:70px;padding:10px;border:1px solid #486966;background:#0a181a;color:#adc5bd;text-align:left}.mode-switch button strong{display:block;color:var(--ink)}.mode-switch button small{display:block;margin-top:3px;font-size:11px}.mode-switch button.selected{border-color:var(--mint);background:#173d37;box-shadow:inset 0 0 0 1px #71d6bd55}.rules{display:grid;gap:8px;margin:0 0 15px;padding:0;list-style:none}.rules li{padding:9px 11px;border-left:3px solid var(--mint);background:#091719;color:#c2d5cf;font-size:13px}.rules b{color:var(--ink)}.lobby input{width:100%;margin:6px 0;padding:12px;border:1px solid #466561;background:#091719;color:var(--ink)}.lobby-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:11px}.lobby-actions button{min-height:46px;background:#315b59;color:#effcf5;font-weight:800}.lobby-actions button:first-child{background:var(--mint);color:#071515}.join-note{margin-top:8px!important;font-size:11px!important;text-align:center}.hidden{display:none!important}@media(max-width:920px){.wrap{grid-template-columns:1fr}.stage,.hud{min-height:550px}aside{display:grid;grid-template-columns:1fr 1fr}.controls{grid-column:1/-1}}@media(max-width:610px){.top{height:60px;padding:0 14px}.brand{font-size:17px}.connection{display:none}.wrap{padding:12px;gap:12px}.stage,.hud{min-height:520px}.hud{padding:15px}.mission{padding:10px}.mission h1{font-size:19px}.clock{min-width:86px}.clock strong{font-size:24px}.lower{align-items:stretch;flex-direction:column}.consequence,.meter{max-width:none;width:100%}.listener{padding:12px}.word{min-width:105px;font-size:18px}aside{display:flex}.mode-switch{grid-template-columns:1fr}.lobby{padding:20px}}
    .world-props{position:absolute;z-index:1;inset:0;pointer-events:none;overflow:hidden}.hud{z-index:2}.energy-rack{position:absolute;left:7%;bottom:13%;display:flex;gap:10px;align-items:end}.cell{width:27px;height:76px;border:2px solid #4a716d;background:#102628;box-shadow:inset 0 -12px #071314;transform:skewY(-4deg)}.cell:after{content:"";display:block;width:100%;height:100%;background:linear-gradient(180deg,transparent 55%,#6ed7be00);transition:background .5s,box-shadow .5s}.cell:nth-child(2){height:98px}.cell:nth-child(3){height:62px}.console-core{position:absolute;right:9%;bottom:21%;width:150px;height:80px;border:2px solid #3f6964;background:#081719cc;transform:perspective(180px) rotateX(25deg)}.wave{position:absolute;left:10px;right:10px;height:2px;background:#547b75;top:20px;box-shadow:0 16px #547b75,0 32px #547b75}.escape-gate{position:absolute;left:50%;bottom:0;width:33%;height:65%;transform:translateX(-50%);display:flex;justify-content:center;overflow:hidden}.gate-half{height:100%;width:50%;border:3px solid #547d78;background:linear-gradient(90deg,#0d2527cc,#23454399);transition:transform 1.1s cubic-bezier(.25,.8,.2,1),box-shadow .7s}.gate-half:first-child{border-right:1px solid #86beb4}.gate-half:last-child{border-left:1px solid #86beb4}.listener-shadow{position:absolute;right:15%;top:20%;width:74px;height:155px;border-radius:48% 48% 20% 20%;background:radial-gradient(circle at 50% 20%,#d3625d88 0 7px,transparent 8px),linear-gradient(90deg,transparent,#1e090999,transparent);opacity:.18;filter:blur(3px);transform:translateY(-20px);transition:opacity .5s,transform .5s}.scan-sweep{position:absolute;inset:-30%;background:conic-gradient(from 0deg,transparent 0deg,transparent 315deg,#83e4cf16 350deg,transparent 360deg);animation:sweep 6s linear infinite;transform-origin:50% 50%}@keyframes sweep{to{transform:rotate(360deg)}}.stage[data-progress="1"] .cell:after,.stage[data-progress="2"] .cell:after,.stage[data-progress="3"] .cell:after{background:linear-gradient(180deg,#9effdf,#2ab692);box-shadow:0 0 20px #55e2bd}.stage[data-progress="2"] .wave,.stage[data-progress="3"] .wave{background:#9effdf;box-shadow:0 16px #4fd8b4,0 32px #9effdf;animation:wave 1s ease-in-out infinite}@keyframes wave{50%{transform:scaleX(.55);opacity:.55}}.stage[data-progress="2"] .gate-half,.stage[data-progress="3"] .gate-half{transform:translateX(-14%);box-shadow:inset 0 0 30px #74ead057}.stage[data-progress="2"] .gate-half:last-child,.stage[data-progress="3"] .gate-half:last-child{transform:translateX(14%)}.stage.listening .scan-sweep{animation-duration:1.2s}.stage.listening .console-core{box-shadow:0 0 30px #70d9bd66}.stage.fx-clue .energy-rack{animation:clue .8s ease-out}.stage.fx-success:before{animation:successFlash .7s ease-out}.stage.fx-alert .listener-shadow{opacity:.9;transform:translateY(45px) scale(1.16);filter:blur(1px)}.stage.fx-alert .scan-sweep{background:conic-gradient(from 0deg,transparent 0deg,transparent 315deg,#f1645d50 350deg,transparent 360deg);animation-duration:.7s}.stage.fx-error{animation:impact .42s linear 2}.stage.won .escape-gate:after{content:"";position:absolute;inset:20% 35% 0;background:linear-gradient(180deg,#c8ffef00,#6cf4cf);filter:blur(14px);animation:launch 1.5s ease-in infinite}.stage.won .gate-half{transform:translateX(-70%);box-shadow:0 0 60px #7dffe399}.stage.won .gate-half:last-child{transform:translateX(70%)}.stage.lost .listener-shadow{opacity:1;transform:translateY(95px) scale(1.9);filter:blur(0)}@keyframes clue{50%{filter:brightness(1.7);transform:translateY(-12px)}}@keyframes successFlash{0%{background:#b4ffe700}35%{background:#b4ffe744}100%{background:#b4ffe700}}@keyframes impact{25%{transform:translateX(6px)}75%{transform:translateX(-6px)}}@keyframes launch{50%{transform:translateY(18px);opacity:.45}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
    .listener{position:absolute;z-index:3;top:132px;left:50%;width:min(430px,calc(100% - 46px));padding:8px 14px;transform:translateX(-50%)}.listener .caption{font-size:11px}.listener .words{gap:7px;margin-top:4px}.listener .word{min-width:92px;padding:5px 10px;font-size:16px}.rule-flash{position:absolute;z-index:5;left:50%;top:50%;width:min(520px,calc(100% - 48px));padding:24px 28px;border:1px solid #80d9c5;background:#061719f5;box-shadow:0 0 0 1px #72d5bd44,0 20px 70px #000b;text-align:center;opacity:0;pointer-events:none;transform:translate(-50%,-50%) scale(.92)}.rule-flash.show{animation:ruleReveal 3.2s cubic-bezier(.16,.84,.22,1) both}.rule-flash.alert{border-color:var(--danger);background:#25100ff5}.rule-flash .caption{color:var(--muted);font-size:13px}.rule-flash strong{display:block;margin:5px 0 12px;color:var(--mint);font-size:22px}.rule-flash.alert strong{color:#ff9b91}.rule-flash .words{margin-top:0}.rule-flash .word{min-width:130px;padding:10px 14px;font-size:22px}.rule-flash.alert .word{background:#7b2926;box-shadow:inset 0 0 0 1px #ff9388}@keyframes ruleReveal{0%{opacity:0;transform:translate(-50%,-50%) scale(.82)}12%,75%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-50%) scale(1.04)}}@media(max-width:610px){.listener{top:116px;width:calc(100% - 30px)}.rule-flash{width:calc(100% - 32px);padding:20px 15px}.rule-flash strong{font-size:19px}.rule-flash .word{min-width:100px;font-size:19px}}
  </style>

<body>
  <main class="app" id="app">
    <header class="top"><div class="brand"><span class="eye"></span>别让它听见 <span class="room" id="roomLabel">未加入房间</span></div><div class="connection"><span class="signal" id="signal"></span><span id="connectionLabel">等待连接</span></div></header>
    <section class="wrap">
      <section class="stage" id="stage">
        <canvas class="radar" id="radar"></canvas>
        <div class="world-props" aria-hidden="true"><div class="scan-sweep"></div><div class="listener-shadow"></div><div class="energy-rack"><i class="cell"></i><i class="cell"></i><i class="cell"></i></div><div class="console-core"><i class="wave"></i></div><div class="escape-gate"><i class="gate-half"></i><i class="gate-half"></i></div></div>
        <div class="hud">
          <div class="upper"><div class="mission"><div class="eyebrow" id="modeLabel">单人挑战 · 静默协议</div><h1 id="phase">等待接入</h1><p id="objective">选择模式并进入实验室。</p></div><div class="clock" id="clock"><span>剩余时间</span><strong id="time">01:30</strong></div></div>
          <div class="listener"><div class="caption">禁忌概念 · 不可直接说出</div><div class="words" id="words"><span class="word">--</span><span class="word">--</span></div></div>
          <div class="rule-flash" id="ruleFlash" aria-live="polite"><div class="caption" id="ruleFlashCaption">监听者已锁定语言</div><strong id="ruleFlashTitle">以下概念不能直接说出</strong><div class="words" id="flashWords"><span class="word">--</span><span class="word">--</span></div></div>
          <div class="lower"><div class="consequence" id="consequence">语音是唯一操作方式。先进入实验室。</div><div class="meter"><label>警报等级 <span id="alert">0 / 5</span></label><div class="segments" id="segments"><i></i><i></i><i></i><i></i><i></i></div></div></div>
        </div>
      </section>
      <aside>
        <section class="panel"><div class="controls"><button class="primary" id="start" disabled>启动挑战</button><button class="listen" id="listen" disabled>启动持续监听</button><div class="listen-status" id="listenStatus"></div><div class="voice-examples" id="examples"><span>语音提示</span>进入房间后显示可说的示例。</div></div></section>
        <section class="panel"><div class="head"><span id="taskTitle">逃生协议</span><span class="pill" id="progress">0 / 3</span></div><div class="tasks" id="tasks"></div></section>
        <section class="panel"><div class="head"><span>监听记录</span><span class="pill" id="feedState">待命</span></div><div class="feed" id="feed"><div class="empty">等待任务开始</div></div></section>
      </aside>
    </section>
  </main>
  <dialog id="lobby"><form class="lobby" method="dialog"><h2>选择潜入协议</h2><p>语音是唯一的游戏操作。网页只显示实验室与监听后果。</p><div class="mode-switch"><button type="button" class="selected" data-mode="solo"><strong>单人挑战</strong><small>独自探索、避开禁忌、逃离实验室</small></button><button type="button" data-mode="duo"><strong>双人协作原型</strong><small>与同伴共享房间与警报</small></button></div><ul class="rules" id="rules"><li><b>目标：</b>用语音探索线索并完成三段逃生协议。</li><li><b>风险：</b>红色禁忌概念不能直接说出。</li><li><b>求助：</b>可说“请求提示”，但只剩两次且会提高警报。</li></ul><input id="player" maxlength="24" placeholder="你的代号"><input id="room" maxlength="16" placeholder="房间号（加入双人房间时填写）"><div class="lobby-actions"><button type="button" id="create">创建单人挑战</button><button type="button" id="join">加入房间</button></div><p class="join-note">首次使用请在浏览器允许麦克风权限。</p></form></dialog>
  <script>
    let socket,micStream,audioContext,workletNode,listening=false,selectedMode='solo',lastState=null,sceneTimer,ruleTimer;
    const $=id=>document.getElementById(id),soloTasks=['识别能源','校准频率','解除并点火'],duoTasks=['钥匙','电池','样本'];
    const secure=window.isSecureContext&&!!navigator.mediaDevices?.getUserMedia;
    const time=seconds=>`${String(Math.floor(seconds/60)).padStart(2,'0')}:${String(seconds%60).padStart(2,'0')}`;
    function feed(kind,message){const box=$('feed');if(box.querySelector('.empty'))box.textContent='';const row=document.createElement('div');row.className='event';const tag=document.createElement('strong');tag.textContent=kind;row.append(tag,document.createTextNode(message));box.prepend(row)}
    function speak(text){if(!text||!('speechSynthesis'in window))return;window.speechSynthesis.cancel();const utterance=new SpeechSynthesisUtterance(text);utterance.lang='zh-CN';utterance.rate=1.08;window.speechSynthesis.speak(utterance)}
    function playWav(encoded){const binary=atob(encoded),bytes=new Uint8Array(binary.length);for(let i=0;i<binary.length;i++)bytes[i]=binary.charCodeAt(i);const url=URL.createObjectURL(new Blob([bytes],{type:'audio/wav'}));const audio=new Audio(url);audio.onended=()=>URL.revokeObjectURL(url);audio.play().catch(()=>{});}
    function taskNames(state){return state.mode==='solo'?soloTasks:duoTasks}
    function showRuleFlash(words,alert=false){const flash=$('ruleFlash');$('flashWords').innerHTML=words.map(word=>`<span class="word">${word}</span>`).join('');$('ruleFlashCaption').textContent=alert?'警报触发':'监听者已锁定语言';$('ruleFlashTitle').textContent=alert?'禁忌表达被捕捉':'以下概念不能直接说出';flash.classList.remove('show','alert');void flash.offsetWidth;flash.classList.toggle('alert',alert);flash.classList.add('show');clearTimeout(ruleTimer);ruleTimer=setTimeout(()=>flash.classList.remove('show'),3200)}
    function sceneEffect(type){const scene=$('stage');const kind=type==='clue_revealed'?'fx-clue':type==='stage_completed'||type==='subsystem_unlocked'||type==='game_won'||type==='game_started'?'fx-success':type==='alert_raised'||type==='game_lost'?'fx-alert fx-error':'';if(!kind)return;scene.classList.remove('fx-clue','fx-success','fx-alert','fx-error');void scene.offsetWidth;kind.split(' ').forEach(name=>scene.classList.add(name));clearTimeout(sceneTimer);sceneTimer=setTimeout(()=>scene.classList.remove('fx-clue','fx-success','fx-alert','fx-error'),type==='game_won'?1800:900);if(type==='game_started'||type==='stage_completed')showRuleFlash(lastState?.forbidden_words||['--','--']);if(type==='alert_raised')showRuleFlash(lastState?.forbidden_words||['--','--'],true)}
    function render(state){if(!state)return;lastState=state;const names=taskNames(state),completed=state.completed_items||[],scene=$('stage');scene.dataset.progress=String(completed.length);$('modeLabel').textContent=state.mode_title||'语音协议';$('phase').textContent=({lobby:'等待接入',active:'监听进行中',won:'逃离成功',lost:'监听者已定位'})[state.phase]||state.phase;$('objective').textContent=state.objective||'';$('time').textContent=time(state.remaining_time??90);$('clock').classList.toggle('danger',(state.remaining_time??90)<=15&&state.phase==='active');$('words').innerHTML=(state.forbidden_words||['--','--']).map(word=>`<span class="word">${word}</span>`).join('');$('consequence').textContent=state.last_consequence||'';$('alert').textContent=`${state.alert_level||0} / ${state.max_alert_level||5}`;$('segments').querySelectorAll('i').forEach((node,index)=>node.classList.toggle('on',index<(state.alert_level||0)));scene.classList.toggle('alert',(state.alert_level||0)>=3&&state.phase==='active');scene.classList.toggle('won',state.phase==='won');scene.classList.toggle('lost',state.phase==='lost');$('progress').textContent=`${completed.length} / ${names.length}`;$('taskTitle').textContent=state.mode==='solo'?'静默协议':'协作清单';$('tasks').innerHTML=names.map((name,index)=>`<div class="task ${completed.includes(name)?'done':''}"><b>${completed.includes(name)?'✓':index+1}</b><span>${name}${state.next_item===name?' · 当前阶段':''}</span></div>`).join('');$('feedState').textContent=state.phase==='active'?'监听中':state.phase==='won'?'已逃离':state.phase==='lost'?'已发现':'待命';$('start').textContent=state.phase==='active'?'挑战进行中':state.phase==='won'||state.phase==='lost'?'重新启动挑战':state.mode==='solo'?'启动单人挑战':'启动双人任务';$('start').disabled=state.phase==='active';const examples=state.voice_examples||[];$('examples').innerHTML=`<span>可直接说</span>${examples.map(item=>`<div>${item}</div>`).join('')||'启动挑战后显示语音提示。'}`;if(state.mode==='solo')$('examples').insertAdjacentHTML('beforeend',`<div>剩余求助：${state.help_remaining??2} 次</div>`)}
    function stop(notify=true){const was=listening;listening=false;$('stage').classList.remove('listening');workletNode?.disconnect();micStream?.getTracks().forEach(track=>track.stop());audioContext?.close();workletNode=micStream=audioContext=null;if(notify&&was&&socket?.readyState===WebSocket.OPEN)socket.send(JSON.stringify({type:'linx_end'}));$('listen').classList.remove('live');$('listen').textContent='启动持续监听';if(!notify)$('listenStatus').textContent='持续监听已停止'}
    async function startListen(){if(!secure){$('listenStatus').textContent='请通过 HTTPS 打开并允许麦克风。';return}try{micStream=await navigator.mediaDevices.getUserMedia({audio:{channelCount:1,echoCancellation:true,noiseSuppression:true}});audioContext=new AudioContext({sampleRate:16000});await audioContext.audioWorklet.addModule('/static/pcm-worklet.js');workletNode=new AudioWorkletNode(audioContext,'pcm-capture');audioContext.createMediaStreamSource(micStream).connect(workletNode);workletNode.port.onmessage=({data})=>{if(!listening||socket?.readyState!==WebSocket.OPEN)return;const pcm=new Int16Array(data.length);for(let i=0;i<data.length;i++)pcm[i]=Math.max(-1,Math.min(1,data[i]))*32767;socket.send(pcm.buffer)};socket.send(JSON.stringify({type:'linx_start',sample_rate:audioContext.sampleRate,continuous:true}));listening=true;$('stage').classList.add('listening');$('listen').classList.add('live');$('listen').textContent='停止持续监听';$('listenStatus').textContent='监听已开启，直接说出你的判断。'}catch(error){$('listenStatus').textContent=`麦克风不可用：${error.message}`}}
    function enter(room,player){socket=new WebSocket(`${location.protocol==='https:'?'wss':'ws'}://${location.host}/ws/${room}?player_id=${encodeURIComponent(player)}`);socket.onopen=()=>{$('roomLabel').textContent=`房间 ${room}`;$('connectionLabel').textContent='已连接';$('signal').classList.add('live');['start','listen'].forEach(id=>$(id).disabled=false);$('lobby').close();feed('系统','已连接。启动挑战后开始语音操作。')};socket.onmessage=event=>{if(typeof event.data!=='string')return;const data=JSON.parse(event.data);if(data.state)render(data.state);if(data.event){const labels={transcript:'听见',clue_revealed:'线索',stage_completed:'完成',subsystem_unlocked:'解锁',help_used:'求助',clarification_needed:'系统',alert_raised:'警报',game_started:'任务',game_won:'逃离',game_lost:'失败'};feed(labels[data.event.type]||'事件',data.event.text||data.event.consequence||data.event.type);sceneEffect(data.event.type);if(data.event.narration)speak(data.event.narration)}if(data.type==='linx_ready')$('listenStatus').textContent='持续监听已连接';if(data.type==='linx_event'&&data.event.type==='stt')$('listenStatus').textContent=`识别：${data.event.text}`;if(data.type==='linx_tts_wav')playWav(data.audio);if(data.type==='linx_error'){feed('错误',data.message);stop(false)}if(data.type==='linx_turn_complete')stop(false)};socket.onclose=()=>{$('connectionLabel').textContent='连接已断开';$('signal').classList.remove('live');stop(false)}}
    document.querySelectorAll('[data-mode]').forEach(button=>button.onclick=()=>{selectedMode=button.dataset.mode;document.querySelectorAll('[data-mode]').forEach(item=>item.classList.toggle('selected',item===button));const solo=selectedMode==='solo';$('create').textContent=solo?'创建单人挑战':'创建双人房间';$('rules').innerHTML=solo?'<li><b>目标：</b>用语音探索线索并完成三段逃生协议。</li><li><b>风险：</b>红色禁忌概念不能直接说出。</li><li><b>求助：</b>可说“请求提示”，但只剩两次且会提高警报。</li>':'<li><b>目标：</b>与同伴共同完成逃生任务。</li><li><b>风险：</b>所有对话都会被监听，红色禁语不能说。</li><li><b>协作：</b>创建房间后把房间号告诉同伴。</li>';});
    $('create').onclick=async()=>{const response=await fetch('/api/rooms',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({mode:selectedMode})});const data=await response.json();enter(data.room_id,$('player').value.trim()||`玩家-${Math.random().toString(16).slice(2,6)}`)};$('join').onclick=()=>{const room=$('room').value.trim().toUpperCase();if(room)enter(room,$('player').value.trim()||`玩家-${Math.random().toString(16).slice(2,6)}`)};$('start').onclick=()=>socket?.send(JSON.stringify({type:'game_start'}));$('listen').onclick=()=>listening?stop():startListen();$('listenStatus').textContent=secure?'进入房间后可启动持续监听。':'需要 HTTPS 才能使用麦克风。';$('lobby').showModal();
    const canvas=$('radar'),context=canvas.getContext('2d');function draw(now){const box=canvas.getBoundingClientRect(),ratio=devicePixelRatio||1;if(canvas.width!==Math.round(box.width*ratio)||canvas.height!==Math.round(box.height*ratio)){canvas.width=Math.round(box.width*ratio);canvas.height=Math.round(box.height*ratio);context.setTransform(ratio,0,0,ratio,0,0)}const width=box.width,height=box.height,alert=lastState?.alert_level||0,phase=lastState?.phase;context.clearRect(0,0,width,height);const x=width*.52,y=height*.55,max=Math.max(width,height)*.58;for(let ring=0;ring<3;ring++){const radius=((now/22+ring*max/3)%max);context.beginPath();context.arc(x,y,radius,0,Math.PI*2);context.strokeStyle=alert>=3?`rgba(241,100,93,${.16*(1-radius/max)})`:`rgba(113,214,189,${.12*(1-radius/max)})`;context.lineWidth=1;context.stroke()}for(let dot=0;dot<9;dot++){const angle=dot*2.2+now/9000;const distance=90+(dot%3)*70;context.beginPath();context.arc(x+Math.cos(angle)*distance,y+Math.sin(angle)*distance*.48,2+(dot%2),0,Math.PI*2);context.fillStyle=dot===2&&phase==='active'?'#f2bd5c':'#71d6bd88';context.fill()}if(listening){context.beginPath();context.arc(x,y,31+Math.sin(now/100)*5,0,Math.PI*2);context.strokeStyle='#71d6bd';context.lineWidth=2;context.stroke()}requestAnimationFrame(draw)}requestAnimationFrame(draw);
